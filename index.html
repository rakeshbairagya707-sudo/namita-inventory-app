<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAMITA STORE - Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-center">NAMITA STORE - Inventory</h1>

        <!-- Customer Section -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Customers</h2>
                <button onclick="openCustomerModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add Customer</button>
            </div>
            <table class="w-full text-left border-collapse border border-gray-200">
                <thead>
                    <tr class="bg-gray-50">
                        <th class="border p-2">Name</th>
                        <th class="border p-2">Phone</th>
                        <th class="border p-2">Action</th>
                    </tr>
                </thead>
                <tbody id="customerTable"></tbody>
            </table>
        </div>

        <!-- Supplier Section -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Suppliers</h2>
                <button onclick="openSupplierModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add Supplier</button>
            </div>
            <table class="w-full text-left border-collapse border border-gray-200">
                <thead>
                    <tr class="bg-gray-50">
                        <th class="border p-2">Name</th>
                        <th class="border p-2">Phone</th>
                        <th class="border p-2">Action</th>
                    </tr>
                </thead>
                <tbody id="supplierTable"></tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript Code -->
    <script>
        // Global State
        const state = {
            customers: [],
            suppliers: []
        };

        // Helper Functions
        function savedData() {
            localStorage.setItem('namita_customers', JSON.stringify(state.customers));
            localStorage.setItem('namita_suppliers', JSON.stringify(state.suppliers));
        }

        function loadData() {
            const savedCustomers = localStorage.getItem('namita_customers');
            const savedSuppliers = localStorage.getItem('namita_suppliers');
            
            if (savedCustomers) state.customers = JSON.parse(savedCustomers);
            if (savedSuppliers) state.suppliers = JSON.parse(savedSuppliers);
            
            renderCustomers();
            renderSuppliers();
        }

        // Print Window Function
        function printBarcode(product) {
            const printWindow = window.open('', '_blank', 'width=300,height=300');
            if (printWindow) {
                printWindow.document.write(`
                    <h3>NAMITA STORE</h3>
                    <p>${product.name}</p>
                    <h2>||||||||||||||||||</h2>
                    <p>${product.barcode}</p>
                `);
                printWindow.print();
                printWindow.close();
            }
        }

        // Customer Operations
        function renderCustomers() {
            const customerTable = document.getElementById('customerTable');
            if (customerTable) {
                customerTable.innerHTML = state.customers.map(c => 
                    `<tr>
                        <td class="border p-2">${c.name}</td>
                        <td class="border p-2">${c.phone}</td>
                        <td class="border p-2"><button onclick="deleteCustomer('${c.id}')" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button></td>
                    </tr>`
                ).join('');
            }
        }

        function openCustomerModal() {
            const name = prompt("Customer Name:");
            const phone = prompt("Phone:");
            if (name) {
                state.customers.push({ id: 'CUST-' + Date.now(), name, phone });
                savedData();
                renderCustomers();
            }
        }

        function deleteCustomer(id) {
            state.customers = state.customers.filter(c => c.id !== id);
            savedData();
            renderCustomers();
        }

        // Supplier Operations
        function renderSuppliers() {
            const supplierTable = document.getElementById('supplierTable');
            if (supplierTable) {
                supplierTable.innerHTML = state.suppliers.map(s => 
                    `<tr>
                        <td class="border p-2">${s.name}</td>
                        <td class="border p-2">${s.phone}</td>
                        <td class="border p-2"><button onclick="deleteSupplier('${s.id}')" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button></td>
                    </tr>`
                ).join('');
            }
        }

        function openSupplierModal() {
            const name = prompt("Supplier Name:");
            const phone = prompt("Phone:");
            if (name) {
                state.suppliers.push({ id: 'SUPP-' + Date.now(), name, phone });
                savedData();
                renderSuppliers();
            }
        }

        function deleteSupplier(id) {
            state.suppliers = state.suppliers.filter(s => s.id !== id);
            savedData();
            renderSuppliers();
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
