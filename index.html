<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <meta
    name="description"
    content="NAMITA STORE - Accounting, Billing & Inventory Management"
  >

  <title>NAMITA STORE — Accounting & Inventory</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "Noto Sans Bengali",
              "Noto Sans",
              "Arial",
              "sans-serif"
            ]
          }
        }
      }
    };
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- NAMITA STORE CONFIG -->
  <script src="./namita-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        "Noto Sans Bengali",
        "Noto Sans",
        Arial,
        sans-serif;

      background: #f8fafc;
      color: #0f172a;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    .hidden {
      display: none !important;
    }

    #print-section {
      display: none;
    }

    @media print {
      body > * {
        display: none !important;
      }

      #print-section {
        display: block !important;
        width: 100%;
      }

      @page {
        margin: 8mm;
      }
    }

    @media (max-width: 640px) {
      body {
        font-size: 14px;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       NAMITA STORE APPLICATION
       IMPORTANT: index.js expects #main-content
       ===================================================== -->

  <div id="app">

    <div
      id="main-content"
      class="min-h-screen"
    >
      <!-- Initial Loading Screen -->

      <div class="min-h-screen flex items-center justify-center p-6">

        <div class="text-center">

          <div
            class="mx-auto mb-4 h-12 w-12 rounded-full border-4 border-slate-200 border-t-blue-600 animate-spin"
          ></div>

          <h1 class="text-xl font-bold text-slate-800">
            NAMITA STORE
          </h1>

          <p class="mt-2 text-sm text-slate-500">
            Application loading...
          </p>

        </div>

      </div>

    </div>

  </div>

  <!-- Print Area -->
  <div id="print-section"></div>

  <!-- Main Application -->
  <script src="./index.js"></script>

</body>
</html>
