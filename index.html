<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>NAMITA STORE — Accounting & Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Noto Sans Bengali', 'Noto Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f4f7f7;color:#172033;font-family:'Noto Sans Bengali','Noto Sans',sans-serif}
    .sidebar{background:linear-gradient(180deg,#0f766e,#115e59)}
    .nav-btn{transition:.18s}.nav-btn:hover{background:rgba(255,255,255,.12)}.nav-btn.active{background:#fff;color:#115e59;box-shadow:0 5px 18px rgba(0,0,0,.08)}
    .card{background:#fff;border:1px solid #e7ecec;border-radius:16px;box-shadow:0 4px 18px rgba(15,118,110,.05)}
    .modal-backdrop{background:rgba(15,23,42,.55);backdrop-filter:blur(3px)}
    input,select,textarea{outline:none} input:focus,select:focus,textarea:focus{border-color:#0f766e!important;box-shadow:0 0 0 3px rgba(15,118,110,.1)}
    .toast{animation:toast .2s ease-out}@keyframes toast{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    .scrollbar::-webkit-scrollbar{width:6px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
    @media(max-width:900px){.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{width:100%}}
  </style>
</head>
<body>
<div id="app" class="min-h-screen"></div>
<script src="index.js"></script>
</body>
</html>
