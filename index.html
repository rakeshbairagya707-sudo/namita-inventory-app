<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>NAMITA STORE — Accounting & Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#172033;font-family:Arial,'Noto Sans Bengali',sans-serif}
    .sidebar{background:linear-gradient(180deg,#0f766e,#115e59)}
    .nav-btn{transition:.18s}.nav-btn:hover{background:#ffffff22}.nav-btn.active{background:#fff;color:#115e59}
    .card{background:#fff;border:1px solid #e7ecec;border-radius:16px;box-shadow:0 4px 18px #0f766e0d}
    .modal-backdrop{background:#0f172a99;backdrop-filter:blur(3px)}
    input,select,textarea{outline:none}input:focus,select:focus,textarea:focus{border-color:#0f766e!important;box-shadow:0 0 0 3px #0f766e1a}
    .barcode-label{display:inline-flex;flex-direction:column;align-items:center;border:1px dashed #aaa;padding:8px;margin:5px;background:#fff}
    @media(max-width:900px){.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.content{width:100%}}
    @media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen"></div>
  <script src="index.js"></script>
</body>
</html>
