<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namita Store - POS & Inventory Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 h-screen">
        <!-- Left Section: Product Search & List -->
        <div class="md:col-span-2 bg-white p-4 rounded-lg shadow flex flex-col">
            <div class="flex items-center gap-2 mb-4">
                <input type="text" id="searchBox" placeholder="Search by Product Name or Barcode..." class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="grid grid-cols-3 gap-3 overflow-y-auto flex-1" id="productList">
                <!-- Sample Product Card -->
                <div onclick="addToCart('Namita Store Special Item', 500)" class="border p-3 rounded cursor-pointer hover:shadow-md bg-white">
                    <h4 class="font-bold text-sm">Namita Store Item</h4>
                    <p class="text-gray-600 text-xs">₹500.00</p>
                    <span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded">In Stock: 25</span>
                </div>
            </div>
        </div>

        <!-- Right Section: POS Cart & Billing Summary -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-bold mb-3 border-b pb-2">Current Sale / POS</h2>
                <div class="overflow-y-auto max-h-64 mb-4" id="cartItems">
                    <p class="text-gray-400 text-sm">Cart is empty</p>
                </div>
            </div>

            <div>
                <div class="space-y-1 text-sm border-t pt-2">
                    <div class="flex justify-between"><span>Subtotal:</span> <span id="subtotal">₹0.00</span></div>
                    <div class="flex justify-between font-bold text-base border-t pt-1"><span>Grand Total:</span> <span id="grandTotal">₹0.00</span></div>
                </div>

                <div class="mt-3">
                    <label class="text-xs font-semibold text-gray-600">Payment Method</label>
                    <select id="paymentMethod" class="w-full p-2 border rounded mt-1 text-sm">
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI / QR</option>
                        <option value="Card">Card</option>
                    </select>
                </div>

                <button onclick="completeCheckout()" class="w-full mt-4 bg-blue-600 text-white py-2.5 rounded font-bold hover:bg-blue-700 transition">
                    Complete Sale & Print
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cartItems');
            const subtotalEl = document.getElementById('subtotal');
            const grandTotalEl = document.getElementById('grandTotal');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-gray-400 text-sm">Cart is empty</p>';
                subtotalEl.innerText = '₹0.00';
                grandTotalEl.innerText = '₹0.00';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                html += `<div class="flex justify-between items-center mb-2 text-sm border-b pb-1">
                    <div><p class="font-semibold">${item.name}</p><p class="text-xs text-gray-500">₹${item.price} x ${item.qty}</p></div>
                    <p class="font-bold">₹${item.price * item.qty}</p>
                </div>`;
            });

            cartContainer.innerHTML = html;
            subtotalEl.innerText = '₹' + total.toFixed(2);
            grandTotalEl.innerText = '₹' + total.toFixed(2);
        }

        function completeCheckout() {
            if(cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            alert('Sale completed successfully! Stock updated.');
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
